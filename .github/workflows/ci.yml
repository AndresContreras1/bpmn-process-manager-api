name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and verify
        run: ./mvnw -B clean verify

      - name: Upload test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Test Results (${{ matrix.os }})
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload JaCoCo coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  architecture-guard:
    name: Architecture Rules
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run ArchUnit tests
        run: ./mvnw -B test -Dtest="com.facimus.procesos.arquitectura.**" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Architecture tests summary
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Architecture Rules
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true

  docker-build:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, architecture-guard]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t bpmn-process-manager-api:${{ github.sha }} .

      - name: Verify the API answers from the container
        run: |
          docker run -d --name api -p 8080:8080 \
            -e JWT_SECRET=ci-only-signing-key-with-at-least-32-characters \
            -e SPRING_DATASOURCE_URL=jdbc:h2:mem:ci \
            bpmn-process-manager-api:${{ github.sha }}
          for intento in $(seq 1 30); do
            if curl -fs http://localhost:8080/v3/api-docs > /dev/null; then
              echo "The API is up."
              exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1

      - name: Verify the prod profile with Docker Compose
        run: |
          # compose.yaml declares this tag, so it reuses the image built above instead of building it again.
          docker tag bpmn-process-manager-api:${{ github.sha }} bpmn-process-manager-api:latest
          cp .env.example .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=ci-only-password/" .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=ci-only-signing-key-with-at-least-32-characters/" .env
          sed -i "s/^API_PORT=.*/API_PORT=8081/" .env
          docker compose up -d
          # The API answers once PostgreSQL is healthy, Flyway has migrated it and Hibernate has validated the
          # schema. Until then curl fails, and Actions runs this script with bash -e: it must stay in a condition.
          for intento in $(seq 1 40); do
            curl -s -o /dev/null http://localhost:8081/ && break
            sleep 2
          done
          # Registering a store proves the API writes to the database of the stack.
          if curl -sS --fail-with-body -X POST http://localhost:8081/api/v1/empresas \
            -H 'Content-Type: application/json' \
            -d '{"nombreEmpresa":"CI Store","nit":"900000001-1","correoContacto":"ci@store.com","nombreAdmin":"CI Admin","emailAdmin":"ci@store.com","passwordAdmin":"secret123"}'; then
            echo
            echo "The prod profile runs on PostgreSQL through Docker Compose."
            docker compose down -v
            exit 0
          fi
          docker compose logs
          exit 1

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Skip when SonarCloud is not configured
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN is not set, so the SonarCloud analysis is skipped."

      - name: Checkout
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build, test and analyze
        if: env.SONAR_TOKEN != ''
        run: ./mvnw -B verify sonar:sonar -Dsonar.token=$SONAR_TOKEN

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build
