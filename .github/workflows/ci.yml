name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and verify
        run: ./mvnw -B clean verify

      - name: Upload test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results (${{ matrix.os }})
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload JaCoCo coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  architecture-guard:
    name: Architecture Rules
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run ArchUnit tests
        run: ./mvnw -B test -Dtest="com.facimus.procesos.arquitectura.**" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Architecture tests summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Architecture Rules
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true

  docker-build:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, architecture-guard]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t bpmn-process-manager-api:${{ github.sha }} .

      - name: Verify the API answers from the container
        run: |
          docker run -d --name api -p 8080:8080 \
            -e JWT_SECRET=ci-only-signing-key-with-at-least-32-characters \
            -e SPRING_DATASOURCE_URL=jdbc:h2:mem:ci \
            bpmn-process-manager-api:${{ github.sha }}
          for intento in $(seq 1 30); do
            if curl -fs http://localhost:8080/v3/api-docs > /dev/null; then
              echo "The API is up."
              exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1

      - name: Verify the prod profile on PostgreSQL
        run: |
          docker network create smoke
          docker run -d --name db --network smoke \
            -e POSTGRES_DB=procesos -e POSTGRES_USER=procesos -e POSTGRES_PASSWORD=procesos \
            postgres:16
          # By TCP only the final server answers, not the temporary one that runs the image's init scripts.
          for intento in $(seq 1 30); do
            docker exec db pg_isready -h localhost -U procesos -d procesos > /dev/null && break
            sleep 1
          done
          docker run -d --name api-prod --network smoke -p 8081:8080 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DB_HOST=db -e DB_PASSWORD=procesos \
            -e JWT_SECRET=ci-only-signing-key-with-at-least-32-characters \
            bpmn-process-manager-api:${{ github.sha }}
          # The API answers once Flyway has migrated PostgreSQL and Hibernate has validated the schema. Until then
          # curl fails, and Actions runs this script with bash -e: curl must stay in a condition (&&, if).
          for intento in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8081/ && break
            sleep 2
          done
          # Registering a store proves the API writes to that schema.
          if curl -sS --fail-with-body -X POST http://localhost:8081/api/v1/empresas \
            -H 'Content-Type: application/json' \
            -d '{"nombreEmpresa":"CI Store","nit":"900000001-1","correoContacto":"ci@store.com","nombreAdmin":"CI Admin","emailAdmin":"ci@store.com","passwordAdmin":"secret123"}'; then
            echo
            echo "The prod profile runs on PostgreSQL."
            exit 0
          fi
          docker logs api-prod
          exit 1

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Skip when SonarCloud is not configured
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN is not set, so the SonarCloud analysis is skipped."

      - name: Checkout
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build, test and analyze
        if: env.SONAR_TOKEN != ''
        run: ./mvnw -B verify sonar:sonar -Dsonar.token=$SONAR_TOKEN
