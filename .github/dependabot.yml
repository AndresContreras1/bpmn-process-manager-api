# Dependabot opens a pull request when something this project depends on has a new release, and each one goes through
# the whole pipeline like any other change.
#
# Updates arrive on Mondays: one pull request per ecosystem with every minor and patch release of the week, and one
# per dependency for a major release, which is the kind that needs reading. A release has to be seven days old before
# it is offered, because most compromised packages are found and pulled within that time. Security updates for a
# known vulnerability do not wait for the schedule.
version: 2

updates:
  - package-ecosystem: maven
    directories: ["/", "/e2e"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      maven:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # Angular moves one major version at a time with `ng update`, which also migrates the code, and TypeScript and
      # zone.js follow the range each Angular version supports. These come back when the app is on a supported major.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The workflows pin each action to a commit SHA; Dependabot moves the SHA and the version in the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # Base images are pinned by digest as well as by tag: the same tag is rebuilt with security fixes, and a digest
  # only changes when a pull request says so.
  #
  # A major version of a base image is a decision, not an update: the Java and Node lines follow their long-term
  # support releases and what the framework supports, and a new major of PostgreSQL needs its data upgraded. Those
  # come in a pull request of their own that says why; Dependabot keeps the rebuilds and the minor releases.
  - package-ecosystem: docker
    directories: ["/", "/frontend"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      images:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The API and the web images are built from this repository, not pulled from a registry.
      - dependency-name: "bpmn-process-manager-*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
