# Perfil prod: PostgreSQL externo via variables de entorno, sin datos demo ni herramientas de desarrollo.
# Spring Boot deduce el driver y Hibernate el dialecto a partir de la URL.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:procesos}
spring.datasource.username=${DB_USER:procesos}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=false

# El contrato de la API no se publica en produccion
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Sin valor por defecto: si falta JWT_SECRET la aplicacion no arranca
jwt.secret=${JWT_SECRET}

# Concurrencia. El pool de conexiones es el techo real del trabajo simultaneo contra PostgreSQL: mas conexiones que
# nucleos tiene la base no hacen mas trabajo, hacen mas espera. El pool es de tamano fijo (no crece ni se encoge) y
# una peticion espera tres segundos por una conexion antes de rendirse con un error, en vez de quedarse colgada.
spring.datasource.hikari.pool-name=procesos-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=3000
# Media hora de vida por conexion: menos que cualquier corte de inactividad de la base o de la red.
spring.datasource.hikari.max-lifetime=1800000

# Los hilos de Tomcat atienden muchas mas peticiones que conexiones hay, porque la mayoria espera por el pool o por
# la red. Lo que no cabe en los hilos hace cola; lo que no cabe en la cola se rechaza rapido en vez de acumularse.
server.tomcat.threads.max=${SERVER_THREADS:200}
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=200
server.tomcat.max-connections=8192
