# Perfil prod: PostgreSQL externo via variables de entorno, sin datos demo ni herramientas de desarrollo.
# Spring Boot deduce el driver y Hibernate el dialecto a partir de la URL.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:procesos}
spring.datasource.username=${DB_USER:procesos}
spring.datasource.password=${DB_PASSWORD:}

# El contrato de la API no se publica en produccion
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator en su propio puerto: las sondas del contenedor y Prometheus lo leen dentro de la red, y ni NGINX ni Caddy
# lo publican. En el puerto de la API no queda nada de Actuator.
management.server.port=${MANAGEMENT_PORT:8081}

# Logs en JSON con el esquema de Elastic (ECS): una linea por evento, con el requestId de la peticion, que un
# agregador lee sin expresiones regulares.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=bpmn-process-manager-api
logging.structured.ecs.service.environment=prod

# Sin valor por defecto: si falta JWT_SECRET la aplicacion no arranca
jwt.secret=${JWT_SECRET}

# Concurrencia. Las peticiones corren en hilos virtuales (application.properties), asi que el pool de conexiones es el
# techo real del trabajo simultaneo contra PostgreSQL: mas conexiones que nucleos tiene la base no hacen mas trabajo,
# hacen mas espera. El pool es de tamano fijo (no crece ni se encoge) y una peticion espera tres segundos por una
# conexion antes de rendirse con un error, en vez de quedarse colgada.
spring.datasource.hikari.pool-name=procesos-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=3000
# Media hora de vida por conexion: menos que cualquier corte de inactividad de la base o de la red.
spring.datasource.hikari.max-lifetime=1800000

# Tomcat ya no tiene un pool de hilos que dimensionar: cada peticion aceptada recibe su hilo virtual. Lo que se
# acota son las conexiones abiertas y la cola del sistema operativo; lo que no cabe se rechaza rapido en vez de
# acumularse.
server.tomcat.accept-count=200
server.tomcat.max-connections=8192
