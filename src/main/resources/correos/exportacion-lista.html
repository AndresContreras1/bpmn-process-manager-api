<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
  <meta charset="UTF-8">
  <title th:text="#{exportacion-lista.asunto(${organizacion})}">Asunto</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; color: #212529; line-height: 1.5;">
  <p th:text="#{exportacion-lista.saludo(${nombre})}">Hola:</p>
  <p th:text="#{exportacion-lista.cuerpo(${organizacion}, ${archivos}, ${tamano})}">Cuerpo</p>
  <p>
    <a th:href="${enlace}" th:text="#{exportacion-lista.boton}"
       style="display: inline-block; padding: 10px 18px; background: #0f6e56; color: #ffffff; text-decoration: none; border-radius: 4px;">Boton</a>
  </p>
  <p th:text="#{exportacion-lista.vence(${horas})}">Vence</p>
  <p>
    <span th:text="#{exportacion-lista.huella}">Huella</span><br>
    <code th:text="${sha256}">sha256</code>
  </p>
  <p th:text="#{exportacion-lista.ignorar}">Ignorar</p>
  <p style="font-size: 12px; color: #6c757d;">
    <span th:text="#{comun.copiar}">Copiar</span><br>
    <span th:text="${enlace}">Enlace</span>
  </p>
  <p style="font-size: 12px; color: #6c757d;" th:text="#{comun.firma}">Firma</p>
</body>
</html>
