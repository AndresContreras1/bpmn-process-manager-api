# The words of the e-mails, in English.
comun.copiar=If the button does not work, copy this address into your browser:
comun.firma=BPMN Process Manager

verificar-correo.asunto=Verify your e-mail
verificar-correo.saludo=Hello, {0}:
verificar-correo.cuerpo=To finish opening your store in BPMN Process Manager, confirm that this e-mail is yours.
verificar-correo.boton=Verify my e-mail
verificar-correo.vence=The link works once and expires in {0} hours.
verificar-correo.ignorar=If it was not you, ignore this e-mail.

recuperar-clave.asunto=Reset your password
recuperar-clave.saludo=Hello, {0}:
recuperar-clave.cuerpo=Someone asked to reset the password of your account. If it was you, choose a new one with this link.
recuperar-clave.boton=Choose a new password
recuperar-clave.vence=The link works once and expires in {0} minutes. Using it signs you out everywhere.
recuperar-clave.ignorar=If you did not ask for it, ignore this e-mail: your password stays the same.

invitacion.asunto=You were invited to a store on BPMN Process Manager
invitacion.saludo=Hello:
invitacion.cuerpo={0} invites you to work in the store {1} on BPMN Process Manager.
invitacion.boton=Accept the invitation
invitacion.vence=The link works once and expires in {0} days.
invitacion.ignorar=If you were not expecting this invitation, ignore this e-mail.
