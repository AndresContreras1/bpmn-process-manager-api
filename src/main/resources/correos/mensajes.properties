# Las palabras de los correos, en espanol, que es tambien el idioma de quien no pidio otro. {0} y {1} son los datos
# de cada correo; un apostrofo se escribe con el signo tipografico, que MessageFormat no confunde con un escape.
comun.copiar=Si el botón no funciona, copia esta dirección en tu navegador:
comun.firma=BPMN Process Manager

verificar-correo.asunto=Verifica tu correo
verificar-correo.saludo=Hola, {0}:
verificar-correo.cuerpo=Para terminar de abrir tu tienda en BPMN Process Manager, confirma que este correo es tuyo.
verificar-correo.boton=Verificar mi correo
verificar-correo.vence=El enlace sirve una sola vez y vence en {0} horas.
verificar-correo.ignorar=Si no fuiste tú, ignora este correo.

recuperar-clave.asunto=Restablece tu contraseña
recuperar-clave.saludo=Hola, {0}:
recuperar-clave.cuerpo=Alguien pidió restablecer la contraseña de tu cuenta. Si fuiste tú, elige una nueva con este enlace.
recuperar-clave.boton=Elegir una contraseña nueva
recuperar-clave.vence=El enlace sirve una sola vez y vence en {0} minutos. Al usarlo se cierran todas tus sesiones.
recuperar-clave.ignorar=Si no lo pediste, ignora este correo: tu contraseña no cambia.

invitacion.asunto=Te invitaron a una tienda en BPMN Process Manager
invitacion.saludo=Hola:
invitacion.cuerpo={0} te invita a trabajar en la tienda {1} en BPMN Process Manager.
invitacion.boton=Aceptar la invitación
invitacion.vence=El enlace sirve una sola vez y vence en {0} días.
invitacion.ignorar=Si no esperabas esta invitación, ignora este correo.
