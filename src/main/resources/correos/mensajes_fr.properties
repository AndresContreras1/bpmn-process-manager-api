# Les mots des courriels, en français.
comun.copiar=Si le bouton ne fonctionne pas, copiez cette adresse dans votre navigateur :
comun.firma=BPMN Process Manager

verificar-correo.asunto=Vérifiez votre adresse e-mail
verificar-correo.saludo=Bonjour {0},
