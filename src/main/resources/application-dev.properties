# Perfil dev (el de por defecto): PostgreSQL 16, el motor de produccion, SQL en el log y la tienda demo.
# Spring Boot levanta compose.dev.yaml al arrancar y conecta la aplicacion sola. El contenedor sigue corriendo al
# detenerla, asi el siguiente arranque no espera, y los datos viven en su volumen. Sin Docker: DB_HOST, DB_PORT,
# DB_NAME, DB_USER y DB_PASSWORD con spring.docker.compose.enabled=false, como en prod.
spring.docker.compose.file=compose.dev.yaml
spring.docker.compose.lifecycle-management=start-only
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:procesos}
spring.datasource.username=${DB_USER:procesos}
spring.datasource.password=${DB_PASSWORD:}

# El correo de dev va a Mailpit, que levanta el mismo compose.dev.yaml: lo atrapa y lo muestra en
# http://localhost:8025, sin mandar nada afuera.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true
