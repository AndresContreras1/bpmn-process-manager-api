spring.application.name=procesos

# Base de datos H2 embebida, persistida en archivo local (./data)
spring.datasource.url=jdbc:h2:file:./data/procesos;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# Seguridad: sin JWT_SECRET se genera una clave aleatoria en cada arranque (solo desarrollo)
jwt.secret=${JWT_SECRET:}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:1800}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# La autenticacion es por JWT: sin esto Spring crea un usuario en memoria e imprime su contrasena
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
