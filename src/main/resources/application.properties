spring.application.name=procesos

# Sin SPRING_PROFILES_ACTIVE la aplicacion arranca en dev. Los tests declaran su perfil con @ActiveProfiles.
spring.profiles.default=dev

# Flyway crea y versiona el esquema, uno solo porque el motor es siempre PostgreSQL; Hibernate solo comprueba que
# coincida
spring.flyway.locations=classpath:db/migration/common
# PR 51: Flyway migra con su propia conexion, como el dueno de las tablas; la API trabaja como procesos_app.
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
# PR 51: lo que ve una conexion cuyo hilo no dijo de que tienda es: ninguna fila.
rls.contexto-por-defecto=NINGUNA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# PR 36: la salud de la base. Al asumir procesos_app, cada conexion de la API recibe los topes de ese rol: una
# sentencia que pasa el primero se cancela, y una transaccion que se queda abierta sin hacer nada mas que el segundo
# pierde su conexion, que el pool cambia por otra. Flyway migra sin topes.
bd.tope-por-sentencia=${DB_STATEMENT_TIMEOUT:30s}
bd.tope-inactiva-en-transaccion=${DB_IDLE_IN_TRANSACTION_TIMEOUT:60s}
# Una conexion que sale del pool y no vuelve en este tiempo, en milisegundos, deja en el log un aviso con la pila de
# quien la tomo: es una fuga, o un trabajo que retiene la conexion mas de lo que deberia.
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_THRESHOLD:20000}
# Hibernate manda en un solo viaje las sentencias iguales de una misma transaccion, hasta 50, y ordena los UPDATE por
# tabla para que se puedan agrupar: dar de baja un proceso con todo su modelo cuesta lo mismo con una lane que con
# tres. Los INSERT no se agrupan: con ids IDENTITY, Hibernate necesita el de cada fila en cuanto la inserta.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_updates=true

# D34: cada instancia escucha en PostgreSQL las sesiones que cierran las demas y las revoca al momento
sesiones.escuchar-cierres=true

# D34: el outbox de Spring Modulith. Un evento para un receptor @ApplicationModuleListener queda en event_publication
# dentro de la transaccion que lo publica, y se borra cuando el receptor termina; un reinicio entrega otra vez lo que
# quedo. Los receptores que tienen que correr dentro de la transaccion, como el aviso de las sesiones cerradas, no
# pasan por aqui. La tabla la crea Flyway (V25).
spring.modulith.events.registry-trigger-annotation=org.springframework.modulith.events.ApplicationModuleListener
spring.modulith.events.completion-mode=delete
spring.modulith.events.republish-outstanding-events-on-restart=true
spring.modulith.events.jdbc.schema-initialization.enabled=false

# Correo transaccional: el servidor SMTP del proveedor que se elija, porque todos hablan SMTP. Sin SMTP_HOST la
# aplicacion arranca y cada correo falla al salir, a la vista en la cola de trabajos. La salud de Actuator no mira el
# SMTP: un proveedor caido no saca a la API de servicio, el correo espera en la cola y se reintenta.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
management.health.mail.enabled=false
correo.remitente=${MAIL_FROM:BPMN Process Manager <no-reply@localhost>}
# PR 61: los documentos. Sin ALMACEN_S3_BUCKET van a una carpeta del disco (desarrollo, una sola instancia); con el,
# a ese bucket de S3 o de un servicio compatible (ALMACEN_S3_ENDPOINT, como el SeaweedFS de compose.yaml). El ancla
# diaria de la bitacora va a ALMACEN_S3_BUCKET_ANCLAS, creado con Object Lock.
almacen.s3.bucket=${ALMACEN_S3_BUCKET:}
almacen.s3.bucket-de-anclas=${ALMACEN_S3_BUCKET_ANCLAS:}
almacen.s3.endpoint=${ALMACEN_S3_ENDPOINT:}
almacen.s3.region=${ALMACEN_S3_REGION:us-east-1}
almacen.s3.usuario=${ALMACEN_S3_USUARIO:}
almacen.s3.clave=${ALMACEN_S3_CLAVE:}
almacen.s3.cifrar=${ALMACEN_S3_CIFRAR:false}
# Crear al arrancar los buckets que falten, el de anclas con Object Lock: para el SeaweedFS de compose.yaml
almacen.s3.crear-buckets=${ALMACEN_S3_CREAR_BUCKETS:false}
almacen.directorio=${ALMACEN_DIRECTORIO:${java.io.tmpdir}/bpmn-process-manager/almacen}
# Los archivos de paso (una subida antes del almacen, un manual antes de guardarse): una carpeta solo de la API
archivos.temporales=${ARCHIVOS_TEMPORALES:${java.io.tmpdir}/bpmn-process-manager/temporales}
# ClamAV (clamd) revisa cada documento en la cola. Sin ANTIVIRUS_HOST quedan disponibles sin revisar, y lo dicen;
# con DOCUMENTOS_EXIGIR_ANTIVIRUS=true esperan pendientes hasta que haya uno.
antivirus.host=${ANTIVIRUS_HOST:}
antivirus.puerto=${ANTIVIRUS_PUERTO:3310}
antivirus.espera=${ANTIVIRUS_ESPERA:30s}
documentos.tamano-maximo=${DOCUMENTOS_TAMANO_MAXIMO:25MB}
documentos.cuota-por-tienda=${DOCUMENTOS_CUOTA_POR_TIENDA:1GB}
documentos.exigir-antivirus=${DOCUMENTOS_EXIGIR_ANTIVIRUS:false}
documentos.enlace.vida=5m
# Un documento de Office es un ZIP: al abrirlo no puede pasar de esto, ni crecer mas de cien veces, ni tener mas partes
documentos.zip.maximo-descomprimido=200MB
documentos.zip.proporcion-maxima=100
documentos.zip.maximo-de-entradas=10000
# PR 65: el texto de un documento disponible, para buscarlo: hasta tantos caracteres, en tanto tiempo, y cuantos a la vez
documentos.texto.caracteres=${DOCUMENTOS_TEXTO_CARACTERES:1000000}
documentos.texto.espera=${DOCUMENTOS_TEXTO_ESPERA:30s}
documentos.texto.hilos=${DOCUMENTOS_TEXTO_HILOS:2}
# El ancla diaria de la bitacora: cuanto tiempo nadie la puede borrar
bitacora.ancla.retencion=${BITACORA_ANCLA_RETENCION:400d}
# La direccion de la web: los enlaces de los correos llevan a sus pantallas
app.url-publica=${APP_PUBLIC_URL:http://localhost:4200}
# PR 63: el resumen diario de las notificaciones, a la misma hora UTC para todos ("-" lo apaga), cuanto se guarda una
# notificacion ya leida, y cuantos flujos en vivo de notificaciones abre una persona en cada instancia
notificaciones.resumen.cron=${NOTIFICACIONES_RESUMEN_CRON:0 0 7 * * *}
notificaciones.retencion=${NOTIFICACIONES_RETENCION:90d}
notificaciones.flujo.conexiones-por-usuario=5
# El idioma de quien no dice otro en Accept-Language: el de los correos, y el de lo que se traduzca despues.
spring.web.locale=es

# D34: la cola de trabajos en PostgreSQL. Cada instancia corre TRABAJOS_TRABAJADORES trabajos a la vez; uno que falla
# espera 30 s, despues el doble, hasta una hora, y tras sus intentos queda fallido. Una tienda no tiene mas de
# TRABAJOS_MAXIMO_EN_CURSO_POR_TIENDA corriendo a la vez. Lo terminado se purga a la semana.
trabajos.trabajar=true
trabajos.trabajadores=${TRABAJOS_TRABAJADORES:2}
trabajos.pausa=1s
trabajos.maximo-intentos=5
trabajos.espera-base=30s
trabajos.espera-maxima=1h
trabajos.maximo-en-curso-por-tienda=${TRABAJOS_MAXIMO_EN_CURSO_POR_TIENDA:2}
trabajos.atascado-tras=15m
trabajos.retencion=7d

server.port=8080

# Hilos virtuales: cada peticion corre en uno propio y barato (desde Java 24, synchronized ya no fija el hilo
# portador), asi que lo que limita el trabajo simultaneo es el pool de conexiones a la base, no un pool de hilos.
spring.threads.virtual.enabled=true
# Al apagar, el servidor deja de aceptar peticiones y espera a que terminen las que estan en curso, hasta este tiempo
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}

# Un campo que el contrato no conoce (por ejemplo un empresaId) responde 400 en vez de ignorarse en silencio
spring.jackson.deserialization.fail-on-unknown-properties=true
# OpenAPI: las respuestas se declaran como JSON (no */*) y Swagger UI ordena los tags alfabeticamente
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.tags-sorter=alpha

# Seguridad: sin JWT_SECRET se genera una clave aleatoria en cada arranque (solo desarrollo)
jwt.secret=${JWT_SECRET:}
# Rotar la clave sin cerrar sesiones: la anterior todavia se acepta, pero ya no firma (docs/runbook.md)
jwt.previous-secret=${JWT_PREVIOUS_SECRET:}
# RFC 8725: quien emite el token y para quien es. Un token de otra API, o para otra, no vale aqui.
jwt.issuer=bpmn-process-manager
jwt.audience=bpmn-process-manager-api
# Vida del access token. La del refresh token y la de la sesion las decide cada tienda (PUT
# /api/v1/empresas/actual/configuracion), y este tiene que ser mas corto que la inactividad mas corta, 30 minutos.
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
# PR 49: de esta clave salen la de AES-GCM que cifra el secreto del TOTP y la del HMAC de los codigos de recuperacion.
# Al menos 32 caracteres; dev y test traen una fija y prod no arranca sin ella. Cambiarla deja sin servir los segundos
# factores inscritos: no se rota como la del JWT.
mfa.clave-de-cifrado=${MFA_CLAVE_DE_CIFRADO:}
# PR 50: entrar con Google o Microsoft. Un proveedor sin client-id no se ofrece; sin ninguno, solo hay clave. La
# direccion de vuelta que se registra en cada proveedor es <url de la API>/api/v1/auth/oidc/callback/<google|microsoft>.
oidc.proveedores.google.client-id=${GOOGLE_CLIENT_ID:}
oidc.proveedores.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oidc.proveedores.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
oidc.proveedores.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}
# organizations: cualquier cuenta de trabajo o escuela de Microsoft; el id de una organizacion la deja solo a ella
oidc.proveedores.microsoft.tenant=${MICROSOFT_TENANT:organizations}
# PR 49b: las passkeys (WebAuthn). El RP id es el dominio de la web, sin puerto ni esquema: una passkey solo sirve en
# el sitio donde se creo y en sus subdominios. Los origenes son las direcciones exactas desde las que el navegador
# firma, la de la web en produccion; separadas por comas.
webauthn.rp-id=${WEBAUTHN_RP_ID:localhost}
webauthn.rp-nombre=${WEBAUTHN_RP_NAME:BPMN Process Manager}
webauthn.origenes=${WEBAUTHN_ORIGINS:${app.url-publica}}
# Login: tras estos fallos de un correo desde una IP, responde 429 hasta que el mas viejo salga de la ventana
login.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:5}
login.failed-attempts-window=${LOGIN_FAILED_ATTEMPTS_WINDOW:15m}
# PR 32: el limite de peticiones, en cubos de fichas compartidos por todas las instancias en PostgreSQL. Entrar,
# registrar una tienda y lo que manda correos cuentan por IP; lo demas que cambia algo, por persona. Leer no cuenta.
limites.activos=${LIMITES_ACTIVOS:true}
limites.autenticacion-por-minuto=${LIMITE_AUTENTICACION_POR_MINUTO:30}
limites.registro-por-hora=${LIMITE_REGISTRO_POR_HORA:10}
limites.correo-por-hora=${LIMITE_CORREO_POR_HORA:20}
limites.escritura-por-minuto=${LIMITE_ESCRITURA_POR_MINUTO:600}
# PR 65: buscar es la unica lectura con cubo, por persona
limites.busqueda-por-minuto=${LIMITE_BUSQUEDA_POR_MINUTO:60}
# Lo mas que puede traer el cuerpo de una peticion; mas responde 413 sin leerse. NGINX corta antes, con el mismo tope.
limites.cuerpo-maximo=${LIMITE_CUERPO:1MB}
# PR 54: importar un BPMN. Es el tope de LimitesXml.BPMN, y el de NGINX para esas dos rutas.
limites.cuerpo-maximo-bpmn=${LIMITE_CUERPO_BPMN:5MB}
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=2MB
# Cloudflare Turnstile en el registro de una tienda: vacio, no se pide.
turnstile.secreto=${TURNSTILE_SECRET:}
turnstile.url=${TURNSTILE_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
# Costo de BCrypt, de 4 a 31: cada punto dobla lo que tarda un hash. Subirlo no invalida ninguna clave: el login
# rehace con el nuevo el hash de quien entra.
claves.costo-bcrypt=${CLAVES_COSTO_BCRYPT:10}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Purga nocturna (D20): sesiones muertas, refresh tokens vencidos, claves de idempotencia viejas y, desde el PR 35,
# las tiendas que cumplieron los 30 dias de su baja. LIMPIEZA_CRON=- la apaga. La retencion de sesiones nunca
# puede ser menor que jwt.expiration-seconds: el codigo la sube si lo fuera.
limpieza.cron=${LIMPIEZA_CRON:0 30 3 * * *}
limpieza.retencion-sesiones=${LIMPIEZA_RETENCION_SESIONES:7d}
limpieza.retencion-idempotencia=${LIMPIEZA_RETENCION_IDEMPOTENCIA:24h}

# D19: lo que una version publicada dice no cambia nunca, asi que se guarda en memoria en vez de volver a
# leerlo y volver a masticarlo en cada peticion: el JSON del diagrama y el grafo con el que se ejecuta. Lo que
# nunca se guarda es cual es la version vigente ni si quien pregunta tiene permiso, que se comprueban siempre.
# CACHE_VERSIONES=false la apaga entera (es lo que hacen las pruebas), y el maximo es por cache, no en total.
cache.versiones.activa=${CACHE_VERSIONES:true}
cache.versiones.maximo=${CACHE_VERSIONES_MAXIMO:200}
cache.versiones.inactividad=${CACHE_VERSIONES_INACTIVIDAD:2h}

# D8: cada cuanto avanza un tick el reloj de las tiendas que pidieron que corriera solo. Una tienda en MANUAL,
# que es lo de fabrica, no se mueve nunca por aqui: su reloj lo mueve quien prueba con POST /simulacion/tick.
simulacion.tick=${SIMULACION_TICK:30s}

# Revision de diagramas con IA. Sin GEMINI_API_KEY la funcion queda apagada y el endpoint responde 503: la API
# arranca y funciona igual sin ella. El modelo y la direccion se pueden mover sin recompilar.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.timeout=${GEMINI_TIMEOUT:20s}
# Cada revision cuesta una llamada, asi que se cuentan por tienda en una ventana deslizante. Volver a pedir la
# revision de un diagrama que no cambio no gasta nada: se devuelve la que ya estaba.
revision.max-reviews=${REVISION_MAX_REVIEWS:10}
revision.window=${REVISION_WINDOW:1h}

# Actuator: solo lo que hace falta para operar. health e info son publicos (los lee un balanceador o un contenedor),
# prometheus tambien (lo lee Prometheus, que no trae token) y metrics pide un administrador. En prod todo esto vive en
# un puerto aparte que solo alcanza la red interna (ver application-prod). El estado no da detalles a quien no se
# identifica: diria que motor hay detras.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
# Cada metrica lleva el nombre de la aplicacion, para distinguirla cuando varias escriben en el mismo Prometheus
management.metrics.tags.application=${spring.application.name}

# Trazas (OpenTelemetry). Toda peticion tiene un traceId, que sale en el log y en los errores; los spans se mandan
# por OTLP solo si se dice a donde, con MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT (por ejemplo
# http://collector:4318/v1/traces). De cada cien peticiones se mandan las que diga TRACING_SAMPLING: guardar todas
# cuesta almacenamiento y casi nunca hace falta.
management.tracing.sampling.probability=${TRACING_SAMPLING:0.1}
info.app.name=BPMN Process Manager API
info.app.version=@project.version@
# La autenticacion es por JWT: sin esto Spring crea un usuario en memoria e imprime su contrasena
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
