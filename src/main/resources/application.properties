spring.application.name=procesos

# Sin SPRING_PROFILES_ACTIVE la aplicacion arranca en dev. Los tests declaran su perfil con @ActiveProfiles.
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=8080

# Seguridad: sin JWT_SECRET se genera una clave aleatoria en cada arranque (solo desarrollo)
jwt.secret=${JWT_SECRET:}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:1800}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# La autenticacion es por JWT: sin esto Spring crea un usuario en memoria e imprime su contrasena
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
