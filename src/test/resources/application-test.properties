# Perfil test, activado con @ActiveProfiles("test").
# Cada contexto de Spring tiene su propia base en el PostgreSQL de la corrida (BaseDePruebaPorContexto): los tests
# no comparten datos ni tocan la base de dev. Tampoco hay tienda demo (es solo de dev): cada test crea lo que
# necesita.
jwt.secret=test-only-signing-key-with-at-least-32-characters

# La cache de las versiones publicadas queda apagada: una prueba que publica, lee, cambia y vuelve a leer tiene que
# ver la base, no lo que quedo de la prueba anterior. La que comprueba la cache la enciende ella
# (CacheDeVersionesTest), que es la unica que tiene que saber que existe.
cache.versiones.activa=false

# Nada corre por detras de una prueba: la escucha de las sesiones cerradas en PostgreSQL tampoco. La enciende la
# prueba que arranca dos instancias (DosInstanciasTest), que es la que tiene algo que probar con ella.
sesiones.escuchar-cierres=false

# Tampoco toman trabajos de la cola: las pruebas la corren llamando a ColaDeTrabajos, y la de los trabajadores los
# enciende (TrabajadoresDeLaColaTest).
trabajos.trabajar=false
