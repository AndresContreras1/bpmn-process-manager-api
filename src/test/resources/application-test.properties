# Perfil test, activado con @ActiveProfiles("test").
# Sin URL propia, Spring Boot le da a cada contexto de Spring una H2 en memoria con nombre unico: los tests no
# comparten datos ni tocan ./data. Tampoco hay tienda demo (es solo de dev): cada test crea lo que necesita.
jwt.secret=test-only-signing-key-with-at-least-32-characters

# La cache de las versiones publicadas queda apagada: una prueba que publica, lee, cambia y vuelve a leer tiene que
# ver la base, no lo que quedo de la prueba anterior. La que comprueba la cache la enciende ella
# (CacheDeVersionesTest), que es la unica que tiene que saber que existe.
cache.versiones.activa=false
