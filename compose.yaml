# The whole stack with one command: PostgreSQL 16 and the API in the prod profile.
#   cp .env.example .env   # fill in DB_PASSWORD and JWT_SECRET
#   docker compose up -d --build
# La web queda en http://localhost (o en WEB_PORT) y la API detras de ella, en /api.
# The database keeps its data in a named volume, so `docker compose down` does not lose it; `down -v` does.
# PR 67: every change of the database also goes, encrypted, to a pgBackRest repository in the storage
# (docs/runbook.md#backup-and-recovery); `down -v` deletes that copy too, because it lives in the almacen-data volume.
name: bpmn-process-manager-api

# PR 67: el repositorio de pgBackRest, igual para quien archiva el WAL (db), quien respalda (respaldo) y quien
# restaura (restauracion). Un bucket del almacen con Object Lock, por TLS, y cada archivo cifrado con RESPALDO_CLAVE
# antes de salir. En AWS, el bucket de otra cuenta: se cambian RESPALDO_S3_* y RESPALDO_CREAR_BUCKET va en false.
x-repositorio-de-respaldos: &repositorio
  PGBACKREST_STANZA: procesos
  PGBACKREST_PG1_PATH: /var/lib/postgresql/data
  PGBACKREST_PG1_SOCKET_PATH: /var/run/postgresql
  PGBACKREST_PG1_USER: ${DB_USER:-procesos}
  PGBACKREST_REPO1_TYPE: s3
  PGBACKREST_REPO1_PATH: /pgbackrest
  PGBACKREST_REPO1_S3_ENDPOINT: ${RESPALDO_S3_ENDPOINT:-almacen}
  PGBACKREST_REPO1_STORAGE_PORT: ${RESPALDO_S3_PUERTO:-8334}
  PGBACKREST_REPO1_STORAGE_CA_FILE: ${RESPALDO_S3_CA:-/etc/almacen-ca/almacen.crt}
  PGBACKREST_REPO1_S3_URI_STYLE: path
  PGBACKREST_REPO1_S3_BUCKET: ${RESPALDO_S3_BUCKET:-respaldos}
  PGBACKREST_REPO1_S3_REGION: ${RESPALDO_S3_REGION:-us-east-1}
  PGBACKREST_REPO1_S3_KEY: ${RESPALDO_S3_USUARIO:-${ALMACEN_S3_USUARIO:-procesos}}
  PGBACKREST_REPO1_S3_KEY_SECRET: ${RESPALDO_S3_CLAVE:-${ALMACEN_S3_CLAVE:?set ALMACEN_S3_CLAVE in .env, at least 32 characters}}
  PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
  PGBACKREST_REPO1_CIPHER_PASS: ${RESPALDO_CLAVE:?set RESPALDO_CLAVE in .env, at least 32 characters}
  # Dos completos semanales: entre siete y catorce dias hacia atras se puede volver a cualquier momento
  PGBACKREST_REPO1_RETENTION_FULL: ${RESPALDO_COMPLETOS:-2}
  PGBACKREST_COMPRESS_TYPE: zst
  PGBACKREST_START_FAST: "y"
  PGBACKREST_LOG_LEVEL_CONSOLE: info
  PGBACKREST_LOG_LEVEL_FILE: "off"
  PGBACKREST_LOCK_PATH: /tmp/pgbackrest

services:
  db:
    # PR 67: la misma PostgreSQL 16, con pgBackRest en la imagen (ops/respaldo/Dockerfile).
    build: ./ops/respaldo
    image: bpmn-process-manager-db:latest
    # Con el almacen arriba, un segmento que todavia no puede archivarse (antes de que exista el repositorio) falla
    # al momento y PostgreSQL lo guarda para despues; con el almacen abajo, cada intento esperaria su tiempo maximo y
    # el arranque de una base nueva no terminaria.
    depends_on:
      almacen:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${DB_NAME:-procesos}
      POSTGRES_USER: ${DB_USER:-procesos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      <<: *repositorio
    # pg_stat_statements counts what each query costs; the server has to load it when it starts (docs/runbook.md).
    # PR 67: cada segmento de WAL va al repositorio en cuanto se llena, y a lo sumo cada 60 s si hubo escrituras: lo
    # que se puede perder es menos de un minuto (el RPO).
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "archive_mode=on",
              "-c", "archive_command=pgbackrest --stanza=procesos archive-push %p", "-c", "archive_timeout=60s"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # El socket, para que el servicio respaldo hable con esta base sin abrirle otra puerta
      - postgres-socket:/var/run/postgresql
      - almacen-ca:/etc/almacen-ca:ro
    # The API waits for this check, not for the container to exist: by TCP only the final server answers, not the
    # temporary one PostgreSQL runs while it initialises.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-procesos} -d ${DB_NAME:-procesos}"]
      interval: 5s
      timeout: 3s
      retries: 12
    # PR 67: como la API y la web: sin root, sin capacidades del kernel y sin poder escribir fuera de sus volumenes y
    # de /tmp, que vive en memoria. La imagen ya corre como postgres, el dueno de los datos.
    user: postgres
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # PR 67: un completo cada domingo y un diferencial los demas dias, desde la 01:00 UTC; el primero, en cuanto arranca.
  # Despues de cada uno cuenta las filas de cada tabla y deja un punto de restauracion, que el simulacro usa.
  respaldo:
    build: ./ops/respaldo
    image: bpmn-process-manager-db:latest
    user: postgres
    command: ["respaldo", "programar"]
    depends_on:
      db:
        condition: service_healthy
      almacen:
        condition: service_healthy
    environment:
      <<: *repositorio
      PGHOST: /var/run/postgresql
      PGUSER: ${DB_USER:-procesos}
      PGDATABASE: ${DB_NAME:-procesos}
      RESPALDO_CREAR_BUCKET: ${RESPALDO_CREAR_BUCKET:-true}
      RESPALDO_BLOQUEO_DIAS: ${RESPALDO_BLOQUEO_DIAS:-21}
      RESPALDO_HORA: ${RESPALDO_HORA:-1}
      RESPALDO_DIA_COMPLETO: ${RESPALDO_DIA_COMPLETO:-7}
    volumes:
      # pgBackRest lee los archivos de la base mientras corre; no escribe en ellos
      - postgres-data:/var/lib/postgresql/data:ro
      - postgres-socket:/var/run/postgresql
      - almacen-ca:/etc/almacen-ca:ro
    # Sano mientras el ultimo respaldo tenga menos de 26 horas: si dejan de salir, docker compose ps lo dice. El
    # primero se hace al arrancar, asi que up --wait espera a que la base quede respaldada.
    healthcheck:
      test: ["CMD", "respaldo", "salud"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30m
      start_interval: 5s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # PR 67: el certificado TLS del almacen, una vez. pgBackRest solo habla S3 por TLS, y la API sigue por HTTP en 8333.
  certificados:
    build: ./ops/respaldo
    image: bpmn-process-manager-db:latest
    user: postgres
    command: ["respaldo", "certificado"]
    volumes:
      - almacen-tls:/etc/almacen-tls
      - almacen-ca:/etc/almacen-ca
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  # PR 61: los documentos y el ancla diaria de la bitacora, en un almacen compatible con S3 que no sale de la red del
  # compose. El bucket de anclas se crea con Object Lock: lo que se guarda ahi no se puede borrar antes de su fecha.
  # PR 67: tambien el repositorio de los respaldos, por HTTPS en 8334; el de documentos guarda cada version.
  almacen:
    image: chrislusf/seaweedfs:4.50@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    command: ["server", "-s3", "-dir=/data", "-master.volumeSizeLimitMB=1024", "-volume.max=100",
              "-s3.port.https=8334", "-s3.cert.file=/etc/almacen-tls/almacen.crt",
              "-s3.key.file=/etc/almacen-tls/almacen.key"]
    depends_on:
      certificados:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${ALMACEN_S3_USUARIO:-procesos}
      AWS_SECRET_ACCESS_KEY: ${ALMACEN_S3_CLAVE:?set ALMACEN_S3_CLAVE in .env, at least 32 characters}
    volumes:
      - almacen-data:/data
      - almacen-tls:/etc/almacen-tls:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  api:
    build: .
    # A fixed tag so a build somewhere else, like the CI, can be reused instead of building again.
    image: bpmn-process-manager-api:latest
    depends_on:
      db:
        condition: service_healthy
      almacen:
        condition: service_healthy
    # PR 67: el mismo entorno sirve a la verificacion del simulacro, abajo
    environment: &entorno-de-la-api
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_NAME: ${DB_NAME:-procesos}
      DB_USER: ${DB_USER:-procesos}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env, at least 32 characters}
      # PR 49: cifra el secreto del segundo factor. Cambiarla deja sin servir los que ya estan inscritos.
      MFA_CLAVE_DE_CIFRADO: ${MFA_CLAVE_DE_CIFRADO:?set MFA_CLAVE_DE_CIFRADO in .env, at least 32 characters}
      # PR 32: el limite de peticiones
      LIMITE_AUTENTICACION_POR_MINUTO: ${LIMITE_AUTENTICACION_POR_MINUTO:-30}
      LIMITE_REGISTRO_POR_HORA: ${LIMITE_REGISTRO_POR_HORA:-10}
      LIMITE_CORREO_POR_HORA: ${LIMITE_CORREO_POR_HORA:-20}
      LIMITE_ESCRITURA_POR_MINUTO: ${LIMITE_ESCRITURA_POR_MINUTO:-600}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      # PR 50: Google y Microsoft; vacios, solo hay clave
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-organizations}
      # El navegador manda Origin en cada POST, tambien cuando la web y la API comparten origen a traves de
      # NGINX, y un Origin que no este en esta lista lo rechaza Spring con 403 antes de mirar nada mas. Por eso
      # aqui van las dos formas del mismo sitio: con el puerto y sin el, que es como lo escribe el navegador
      # cuando es el 80.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:${WEB_PORT:-80}}
      # PR 36: los topes de cada conexion de la API y el aviso de una conexion que no vuelve al pool
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-30s}
      DB_IDLE_IN_TRANSACTION_TIMEOUT: ${DB_IDLE_IN_TRANSACTION_TIMEOUT:-60s}
      DB_LEAK_DETECTION_THRESHOLD: ${DB_LEAK_DETECTION_THRESHOLD:-20000}
      # D19: la cache de lo publicado. Se deja encendida y se apaga desde .env para medir la diferencia.
      CACHE_VERSIONES: ${CACHE_VERSIONES:-true}
      # El correo: sin SMTP_HOST la API arranca y los correos esperan en la cola. APP_PUBLIC_URL es la direccion de
      # la web, a la que llevan los enlaces de los correos.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-BPMN Process Manager <no-reply@localhost>}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:${WEB_PORT:-80}}
      # PR 49b: una passkey es del dominio de la web y solo se firma desde sus direcciones exactas. Con el puerto 80
      # el navegador escribe el origen sin puerto, asi que van las dos formas, como en CORS.
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-http://localhost,http://localhost:${WEB_PORT:-80}}
      # PR 61: el almacen de arriba. Con otro S3, como el de AWS, se cambian estas lineas y CREAR_BUCKETS va en false.
      ALMACEN_S3_ENDPOINT: ${ALMACEN_S3_ENDPOINT:-http://almacen:8333}
      ALMACEN_S3_BUCKET: ${ALMACEN_S3_BUCKET:-documentos}
      ALMACEN_S3_BUCKET_ANCLAS: ${ALMACEN_S3_BUCKET_ANCLAS:-anclas-bitacora}
      ALMACEN_S3_USUARIO: ${ALMACEN_S3_USUARIO:-procesos}
      ALMACEN_S3_CLAVE: ${ALMACEN_S3_CLAVE:?set ALMACEN_S3_CLAVE in .env, at least 32 characters}
      ALMACEN_S3_CREAR_BUCKETS: ${ALMACEN_S3_CREAR_BUCKETS:-true}
      # ClamAV (clamd) en el puerto 3310; sin el, los documentos quedan disponibles con la marca de no revisados
      ANTIVIRUS_HOST: ${ANTIVIRUS_HOST:-}
      DOCUMENTOS_EXIGIR_ANTIVIRUS: ${DOCUMENTOS_EXIGIR_ANTIVIRUS:-false}
    # Solo en 127.0.0.1, para quien trabaja en esta maquina: la API cree las cabeceras X-Forwarded-* que le llegan
    # de la red interna, y publicada en todas las interfaces cualquiera de la red local podria inventarse su IP.
    # Desde fuera se entra por la web.
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    # Listo significa que Flyway migro la base y que la conexion responde, no solo que el puerto esta abierto. La
    # sonda esta en el puerto de gestion (8081), que no se publica: solo lo alcanzan el contenedor y la red del compose.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    # Si alguien tomara el proceso, no tendria donde escribir (solo /tmp, que vive en memoria), ni como ganar
    # privilegios, ni ninguna capacidad del kernel que usar.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # El apagado espera a que terminen las peticiones en curso (SHUTDOWN_TIMEOUT, 20 s); despues de esto, docker
    # lo mata.
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    # La aplicacion compilada, servida por NGINX, que ademas es la puerta de la API: el navegador solo habla con el
    build: ./frontend
    image: bpmn-process-manager-web:latest
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:8080"
    # Mira que NGINX este sirviendo, no que la API conteste: la API ya tiene su propia sonda.
    # Va a 127.0.0.1 y no a localhost porque dentro del contenedor localhost tambien es ::1, y NGINX escucha en
    # IPv4: con el nombre, wget prueba primero el ::1 y la sonda falla aunque el servidor este sirviendo.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Igual que la API: NGINX solo escribe en /tmp (su pid y sus temporales), que vive en memoria.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # PR 67: el simulacro de restauracion (ops/respaldo/simulacro.sh), solo con el perfil simulacro. Restaura el ultimo
  # respaldo en un contenedor con la base vacia (un volumen anonimo, que se borra con el contenedor) y arranca
  # PostgreSQL sobre lo restaurado sin archivar nada: lo restaurado no escribe en el repositorio.
  restauracion:
    profiles: [simulacro]
    build: ./ops/respaldo
    image: bpmn-process-manager-db:latest
    user: postgres
    command: ["respaldo", "restaurar"]
    depends_on:
      almacen:
        condition: service_healthy
    environment:
      <<: *repositorio
      PGHOST: /var/run/postgresql
      PGUSER: ${DB_USER:-procesos}
      PGDATABASE: ${DB_NAME:-procesos}
      # Vacio, hasta el punto del ultimo respaldo; un momento ('2026-11-12 10:00:00+00'), o "ultimo", el final del WAL
      RESPALDO_RESTAURAR_HASTA: ${RESPALDO_RESTAURAR_HASTA:-}
    volumes:
      - almacen-ca:/etc/almacen-ca:ro
    # Lista cuando termino de recuperar y ya acepta escrituras: hasta entonces, lo restaurado no esta completo.
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(psql -XAtc 'select not pg_is_in_recovery()' 2>/dev/null)\" = t"]
      interval: 5s
      timeout: 5s
      retries: 720
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  # PR 67: la API contra la base restaurada, solo para verificarla: rehace la cadena de la bitacora de cada tienda,
  # contra su ancla, y la huella de cada version publicada, escribe lo que encontro y termina, con 1 si algo no
  # cuadra. No atiende peticiones, no corre la cola ni las tareas programadas y no crea buckets.
  verificacion:
    profiles: [simulacro]
    image: bpmn-process-manager-api:latest
    depends_on:
      restauracion:
        condition: service_healthy
    environment:
      <<: *entorno-de-la-api
      DB_HOST: restauracion
      RESPALDO_VERIFICAR: "true"
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      ALMACEN_S3_CREAR_BUCKETS: "false"
      TRABAJOS_TRABAJAR: "false"
      LIMPIEZA_CRON: "-"
      BITACORA_ANCLA_CRON: "-"
      SMTP_HOST: ""
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

volumes:
  postgres-data:
  # PR 67: el socket de la base, que comparten db y respaldo
  postgres-socket:
  almacen-data:
  # PR 67: el certificado del almacen para HTTPS, que crea el servicio certificados: con su clave, solo para el
  # almacen, y solo el certificado, para quien habla con el
  almacen-tls:
  almacen-ca:
