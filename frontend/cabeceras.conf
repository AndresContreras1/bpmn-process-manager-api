# Las cabeceras de seguridad de la aplicacion. Se incluyen en cada location que sirve algo de la aplicacion: NGINX no
# hereda un add_header de fuera en una location que tiene alguno propio, y la de /api no las lleva porque la API manda
# las suyas. Todas con always, para que tambien salgan en un 404.
#
# CSP: todo del mismo origen. Los scripts, ademas, solo los que Angular firmo al compilar: autoCsp calcula el hash de
# los dos que deja escritos en el index, y el Dockerfile los copia en lugar de @HASHES_DE_LOS_SCRIPTS@. Los estilos
# admiten 'unsafe-inline' porque Angular pone en la pagina los de cada componente cuando lo pinta. Trusted Types va
# primero en modo informe: la consola avisa de lo que romperia, sin romperlo.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' @HASHES_DE_LOS_SCRIPTS@; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Content-Security-Policy-Report-Only "require-trusted-types-for 'script'; trusted-types angular angular#bundler" always;

# El navegador solo hace caso de HSTS sobre HTTPS, asi que en local no cambia nada. La precarga se pide cuando
# produccion lleve un mes en HTTPS sin problemas (docs/runbook.md).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
