# NGINX sirve la aplicacion compilada y, de paso, es la puerta de la API.
#
# El navegador nunca habla con la API directamente: pide todo al mismo origen y NGINX reenvia lo que empieza por
# /api al contenedor de la API. Con eso no hay CORS que configurar ni una URL distinta por entorno, y la aplicacion
# compilada sirve igual en local, en el compose y en cualquier maquina donde se despliegue.
server {
    # La imagen corre sin privilegios, asi que escucha en 8080 y no en el 80, que necesita ser root.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular resuelve las rutas por su cuenta: lo que no sea un fichero se responde con el index
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Lo que mira el health check del contenedor: que NGINX este sirviendo, sin depender de la API
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Los ficheros compilados llevan un hash en el nombre, asi que no cambian nunca; el index si cambia en cada
    # despliegue y tiene que volver a pedirse, o el navegador seguiria pidiendo los ficheros de la version vieja.
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
