# NGINX sirve la aplicacion compilada y, de paso, es la puerta de la API.
#
# El navegador nunca habla con la API directamente: pide todo al mismo origen y NGINX reenvia lo que empieza por
# /api al contenedor de la API. Con eso no hay CORS que configurar ni una URL distinta por entorno, y la aplicacion
# compilada sirve igual en local, en el compose y en cualquier maquina donde se despliegue.
#
# F12: la web son cuatro compilaciones, una por idioma, cada una en su carpeta (/es-CO/, /en-US/, /en-AU/, /fr-FR/).
# Una direccion sin carpeta va a la del idioma de quien la abre: el que eligio, guardado en la cookie idioma, y si no
# eligio ninguno, el primero que pide su navegador en Accept-Language. Sin nada parecido, espanol de Colombia.

# La cookie solo vale si es uno de los cuatro: cualquier otro valor se ignora.
map $cookie_idioma $idioma_elegido {
    default "";
    es-CO   es-CO;
    en-US   en-US;
    en-AU   en-AU;
    fr-FR   fr-FR;
}

# El idioma que el navegador pone primero. Australia y Nueva Zelanda escriben como en-AU; el resto del ingles, como
# en-US. El de cada lengua vale para todos sus paises: fr-CA lee fr-FR y es-MX lee es-CO.
map $http_accept_language $idioma_del_navegador {
    default             es-CO;
    "~*^\s*en-(au|nz)"  en-AU;
    "~*^\s*en"          en-US;
    "~*^\s*fr"          fr-FR;
    "~*^\s*es"          es-CO;
}

map $idioma_elegido $idioma {
    ""      $idioma_del_navegador;
    default $idioma_elegido;
}

server {
    # La imagen corre sin privilegios, asi que escucha en 8080 y no en el 80, que necesita ser root.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Las redirecciones van al mismo origen con una ruta relativa: NGINX no conoce el puerto que ve el navegador
    absolute_redirect off;

    # Una direccion sin idioma: los enlaces viejos, los escritos a mano y la portada. La respuesta depende de la
    # cookie y del navegador, y asi lo dice Vary, para que ninguna cache la sirva a otra persona.
    location / {
        include /etc/nginx/cabeceras.conf;
        add_header Vary "Cookie, Accept-Language" always;
        add_header Cache-Control "no-store" always;
        return 302 /$idioma$request_uri;
    }

    # Los ficheros compilados llevan un hash en el nombre, asi que no cambian nunca. Va antes que la de cada idioma:
    # de las location con expresion, NGINX usa la primera que coincide.
    location ~* ^/(es-CO|en-US|en-AU|fr-FR)/.+\.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        include /etc/nginx/cabeceras.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cada idioma resuelve sus rutas por su cuenta: lo que no sea un fichero se responde con el index de ese idioma.
    # El index cambia en cada despliegue y tiene que volver a pedirse, o el navegador seguiria pidiendo los ficheros
    # de la version vieja.
    location ~ ^/(es-CO|en-US|en-AU|fr-FR)/ {
        include /etc/nginx/cabeceras.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /$1/index.html;
    }

    # RFC 9116: security.txt vive en la raiz del sitio, no en la carpeta de un idioma. Es el mismo en las cuatro.
    location ^~ /.well-known/ {
        include /etc/nginx/cabeceras.conf;
        root /usr/share/nginx/html/en-US;
        try_files $uri =404;
    }

    # Lo que pide el navegador por su cuenta en la raiz, sin pasar por ningun index.
    location = /favicon.ico {
        include /etc/nginx/cabeceras.conf;
        root /usr/share/nginx/html/en-US;
        expires 1y;
        try_files $uri =404;
    }

    # PR 54: un archivo BPMN pasa facil del mega. Las dos rutas que lo reciben tienen el tope de BPMN de la API (y la
    # misma ruta en GET, que lo descarga, pasa por aqui igual).
    location ~ ^/api/v1/procesos/(importar|[0-9]+/modelo)$ {
        client_max_body_size 5m;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # Lo que responde la API lleva las cabeceras de seguridad que pone la API, para JSON y no para paginas.
    location /api/ {
        # PR 32: el mismo tope de cuerpo que la API, cortado aqui antes de llegar a ella.
        client_max_body_size 1m;
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El id que NGINX le da a cada peticion viaja a la API, que lo pone en sus logs y en sus errores
        proxy_set_header X-Request-Id $request_id;
    }

    # Lo que mira el health check del contenedor: que NGINX este sirviendo, sin depender de la API
    location = /healthz {
        access_log off;
        include /etc/nginx/cabeceras.conf;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
