# gitleaks: the default rules, plus the values that look like secrets and are not.
[extend]
useDefault = true

[[allowlists]]
description = "Signing keys that only exist to sign tokens inside the tests"
regexTarget = "match"
regexes = ['''clave-de-pruebas-de-al-menos-32-bytes''']

[[allowlists]]
description = "The address where Prometheus reads Actuator inside the compose network: a host, a port and a path"
regexTarget = "match"
regexes = ['''api:8081/actuator/prometheus''']

[[allowlists]]
description = "The names of the Flyway migrations, which the migrations test lists: a version and some words, not a key"
regexTarget = "match"
regexes = ['''V\d+__[a-z0-9_]+\.sql''']

[[allowlists]]
description = "The address where NGINX forwards the signed downloads inside the compose network: a host, a port and a path"
regexTarget = "match"
regexes = ['''api:8080/api/v1/descargas/''']
